openapi: 3.1.0
info:
  title: Club Platform HTTP API
  version: 0.5.0
  description: Implemented contract at 320a4c2709c13dd56455768a2f8819a815ad3997 (2026-09-09),
    schema 8. Local service binds 127.0.0.1. Deploy behind an HTTPS reverse proxy
    preserving /api and rewriting upstream Host to localhost/127.0.0.1. Configure
    one exact allowed browser Origin. Ordinary JSON bodies are limited to 16 KiB;
    assets to 8 MiB. actor/actor_id are rejected. Transport-level errors may not use
    the application JSON error shape. OPTIONS preflight for /api/* returns 204 only
    for the configured Origin, otherwise 403 without JSON. No DELETE, audit-list or
    /api/v1 routes are implemented.
servers:
- url: http://127.0.0.1:8080
  description: Local development only; production clients use the configured HTTPS
    proxy origin.
security:
- bearerAuth: []
paths:
  /health:
    get:
      summary: Process readiness
      operationId: get_health
      tags:
      - health
      description: Process readiness response; not a full database or backup health
        report.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
                required:
                - status
        '400': &id001
          description: Invalid input or JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Missing, invalid or expired session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Insufficient permission or rejected Origin/Host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: Referenced entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id005
          description: Revision, hierarchy, schema or data conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id006
          description: Request failed; no internal details disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/auth/login:
    post:
      summary: Create an authenticated session
      operationId: post_api_auth_login
      tags:
      - auth
      description: Default absolute lifetime 8 hours and idle lifetime 30 minutes.
        Repeated failures trigger temporary lockout. Tokens are opaque, not JWTs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
              required:
              - login
              - password
      security: []
  /api/auth/me:
    get:
      summary: Read current session
      operationId: get_api_auth_me
      tags:
      - auth
      description: Read current session
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
  /api/auth/logout:
    post:
      summary: Revoke current session
      operationId: post_api_auth_logout
      tags:
      - auth
      description: Revoke current session
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
  /api/auth/password:
    post:
      summary: Change own password and revoke sessions
      operationId: post_api_auth_password
      tags:
      - auth
      description: Change own password and revoke sessions
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password: &id007
                  type: string
                new_password:
                  type: string
                  minLength: 12
              required:
              - old_password
              - new_password
  /api/persons:
    get:
      summary: List persons
      operationId: get_api_persons
      tags:
      - persons
      description: Requires records.read. Pages contain at most 100 records.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters:
      - &id009
        name: after
        in: query
        required: false
        schema: *id007
        description: Last ID from previous page; omit on first request.
      - &id010
        name: q
        in: query
        required: false
        schema: *id007
        description: Literal, case-sensitive search; resource-specific support.
    post:
      summary: Create person
      operationId: post_api_persons
      tags:
      - persons
      description: Requires records.write. No client actor identity is accepted.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
  /api/persons/{id}:
    get:
      summary: Read person
      operationId: get_api_persons_id
      tags:
      - persons
      description: Requires records.read.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters:
      - name: id
        in: path
        required: true
        schema: &id008
          type: string
          format: uuid
        description: id
    put:
      summary: Update person
      operationId: put_api_persons_id
      tags:
      - persons
      description: Requires records.write. Revision is a decimal JSON string. Stale
        revision produces 409.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id008
        description: id
  /api/management/{resource}:
    get:
      summary: List management records
      operationId: get_api_management_resource
      tags:
      - management
      description: Values and revisions are JSON strings. labels is display-only reference
        metadata. Permission and search/owner support depend on the resource; see
        field reference.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters:
      - &id011
        name: resource
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9_.:-]+$
        description: See reference/resources.md. Native types use ext:module.type.
          Resources differ in supported operations and rights.
      - name: owner
        in: query
        required: false
        schema: *id007
        description: Person/organisation ID or resource-specific owner filter.
      - *id009
      - *id010
    post:
      summary: Create or update management record
      operationId: post_api_management_resource
      tags:
      - management
      description: Supply the complete writable field set. All values, including numbers
        and booleans, are strings. Special resources have different create/edit keys.
        Do not echo labels or read-only fields. See reference/resources.md.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementRow'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementSave'
      parameters:
      - *id011
  /api/branding:
    get:
      summary: Read public login-screen branding
      operationId: get_api_branding
      tags:
      - branding
      description: Public string map with optional logo/background data URIs. Do not
        use confidential images.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: &id014
                type: object
                additionalProperties: *id007
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      security: []
  /api/assets:
    post:
      summary: Upload an asset
      operationId: post_api_assets
      tags:
      - assets
      description: Requires records.write for entity files/photos; security.manage
        for login branding. owner is person/organisation UUID, empty for login branding.
        Decoded general files at most 5 MiB; photo/logo/background at most 2 MiB.
        JSON transport body at most 8 MiB.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementRow'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner: *id007
                purpose:
                  type: string
                  enum:
                  - file
                  - photo
                  - logo
                  - background
                filename: *id007
                media_type: *id007
                content:
                  type: string
                  contentEncoding: base64
                  description: Raw Base64, without data URI prefix.
              required:
              - owner
              - purpose
              - filename
              - media_type
              - content
    get:
      summary: List asset metadata
      operationId: get_api_assets
      tags:
      - assets
      description: 'Requires appropriate read access. No next_cursor member: use last
        item ID as after when the page contains 100 items.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters:
      - name: owner
        in: query
        required: true
        schema: *id007
        description: owner
      - name: purpose
        in: query
        required: true
        schema:
          type: string
          enum:
          - file
          - photo
        description: purpose
      - name: after
        in: query
        required: false
        schema: *id007
        description: after
  /api/assets/{id}:
    get:
      summary: Read asset including Base64 content
      operationId: get_api_assets_id
      tags:
      - assets
      description: Requires records.read. Reads entity-owned assets only; public branding
        is served by /api/branding.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementRow'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters:
      - name: id
        in: path
        required: true
        schema: *id008
        description: id
  /api/extensions:
    get:
      summary: List loaded extension manifests
      operationId: get_api_extensions
      tags:
      - extensions
      description: Requires records.read. installed reports database activation.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Extension'
                required:
                - items
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
  /api/extensions/install:
    post:
      summary: Activate loaded extensions
      operationId: post_api_extensions_install
      tags:
      - extensions
      description: Requires schema.manage. Send JSON object {}. Does not upload or
        hot-load a library.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /api/documents/render:
    post:
      summary: Render plain-text template
      operationId: post_api_documents_render
      tags:
      - documents
      description: 'Requires records.read. Returns rendered title/body, not PDF bytes.
        Clients generate PDFs. Supported placeholders: {{given_name}}, {{family_name}},
        {{date}}.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  body:
                    type: string
                required:
                - title
                - body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id: *id008
                person_id: *id008
                date:
                  type: string
                  format: date
              required:
              - template_id
              - person_id
              - date
  /api/reports:
    get:
      summary: Export filtered records as CSV
      operationId: get_api_reports
      tags:
      - reports
      description: 'UTF-8 with BOM and comma separator; up to 5000 rows. Content-Disposition:
        attachment; filename=report.csv. Resource read rights apply. Not an atomic
        cross-page snapshot.'
      responses:
        '200':
          description: Success
          content:
            text/csv:
              schema: *id007
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters:
      - name: resource
        in: query
        required: true
        schema: *id007
        description: persons, organizations, memberships, positions or ext:module.type
      - name: owner
        in: query
        required: false
        schema: *id007
        description: owner
      - name: q
        in: query
        required: false
        schema: *id007
        description: q
  /api/users:
    post:
      summary: Create login account
      operationId: post_api_users
      tags:
      - users
      description: Requires security.manage. Does not create or link a person automatically.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: *id007
                password:
                  type: string
                  minLength: 12
              required:
              - login
              - password
  /api/users/{id}/active:
    post:
      summary: Enable or disable account
      operationId: post_api_users_id_active
      tags:
      - users
      description: Requires security.manage. active is a JSON boolean; last active
        administrator is protected.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: &id012
                  type: boolean
              required:
              - active
      parameters:
      - name: id
        in: path
        required: true
        schema: *id008
        description: id
  /api/groups:
    post:
      summary: Create group
      operationId: post_api_groups
      tags:
      - groups
      description: Requires security.manage.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id007
              required:
              - name
  /api/roles:
    post:
      summary: Create role
      operationId: post_api_roles
      tags:
      - roles
      description: Requires security.manage.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id007
              required:
              - name
  /api/groups/membership:
    post:
      summary: Set groups membership
      operationId: post_api_groups_membership
      tags:
      - groups
      description: Requires security.manage. enabled is a JSON boolean. Last-administrator
        protections apply.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id: *id008
                user_id: *id008
                enabled: *id012
              required:
              - group_id
              - user_id
              - enabled
  /api/groups/role:
    post:
      summary: Set groups role
      operationId: post_api_groups_role
      tags:
      - groups
      description: Requires security.manage. enabled is a JSON boolean. Last-administrator
        protections apply.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id: *id008
                role_id: *id008
                enabled: *id012
              required:
              - group_id
              - role_id
              - enabled
  /api/roles/permission:
    post:
      summary: Set roles permission
      operationId: post_api_roles_permission
      tags:
      - roles
      description: Requires security.manage. enabled is a JSON boolean. Last-administrator
        protections apply.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id: *id008
                permission: *id007
                enabled: *id012
              required:
              - role_id
              - permission
              - enabled
  /api/fields:
    post:
      summary: Define custom field
      operationId: post_api_fields
      tags:
      - fields
      description: Requires schema.manage.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id008
                  type:
                    $ref: '#/components/schemas/FieldType'
                required:
                - id
                - type
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record_type: *id007
                key: *id007
                type:
                  $ref: '#/components/schemas/FieldType'
              required:
              - record_type
              - key
              - type
  /api/fields/permissions:
    post:
      summary: Set group field permissions
      operationId: post_api_fields_permissions
      tags:
      - fields
      description: Requires security.manage; read and write are JSON booleans.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field_id: *id008
                group_id: *id008
                read: *id012
                write: *id012
              required:
              - field_id
              - group_id
              - read
              - write
  /api/fields/type:
    post:
      summary: Migrate custom field type
      operationId: post_api_fields_type
      tags:
      - fields
      description: Requires schema.manage. Conversion is atomic; an unconvertible
        value rejects the entire change.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field_id: *id008
                type:
                  $ref: '#/components/schemas/FieldType'
              required:
              - field_id
              - type
  /api/records/{id}/fields/{field_id}:
    get:
      summary: Read custom field value
      operationId: get_api_records_id_fields_field_id
      tags:
      - records
      description: Requires records.read and group-level field read access. JSON null
        means no stored value; access denial is 403.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FieldValue'
                - type: 'null'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      parameters: &id013
      - name: id
        in: path
        required: true
        schema: *id008
        description: id
      - name: field_id
        in: path
        required: true
        schema: *id008
        description: field_id
    put:
      summary: Write custom field value
      operationId: put_api_records_id_fields_field_id
      tags:
      - records
      description: Requires records.write and group-level field write access. value
        is a string even for integer/boolean types.
      responses:
        '204':
          description: Success; no response body
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '500': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldValue'
      parameters: *id013
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque 64-character hexadecimal session token (not JWT).
  schemas:
    StringValues: *id014
    Revision:
      type: string
      pattern: ^[0-9]+$
      examples:
      - '1'
    Person:
      type: object
      properties:
        id: *id008
        given_name:
          type: string
        family_name:
          type: string
        revision:
          $ref: '#/components/schemas/Revision'
      required:
      - id
      - given_name
      - family_name
      - revision
    PersonInput:
      type: object
      properties:
        given_name:
          type: string
        family_name:
          type: string
      required:
      - given_name
      - family_name
    PersonUpdate:
      type: object
      properties:
        given_name:
          type: string
        family_name:
          type: string
        revision:
          $ref: '#/components/schemas/Revision'
      required:
      - given_name
      - family_name
      - revision
    ManagementRow:
      type: object
      properties:
        id: *id007
        revision:
          $ref: '#/components/schemas/Revision'
        values:
          $ref: '#/components/schemas/StringValues'
        labels:
          $ref: '#/components/schemas/StringValues'
      required:
      - id
      - revision
      - values
    ManagementSave:
      type: object
      properties:
        id:
          type: string
          description: Empty for create; existing row ID for update.
        revision:
          type: string
          pattern: ^[0-9]+$
          description: Use "0" for creation; otherwise last read revision.
        values:
          $ref: '#/components/schemas/StringValues'
      required:
      - id
      - revision
      - values
    Session:
      type: object
      properties:
        user_id: *id008
        login: *id007
        expires_at: &id015
          type: integer
          format: int64
          description: Absolute expiration, Unix seconds.
      required:
      - user_id
      - login
      - expires_at
    Id:
      type: object
      properties:
        id: *id008
      required:
      - id
    FieldType:
      type: string
      enum:
      - text
      - integer
      - decimal
      - boolean
      - date
    FieldValue:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FieldType'
        value: *id007
      required:
      - type
      - value
    Error:
      type: object
      properties:
        error:
          type: string
          enum:
          - invalid_input
          - invalid_json
          - authentication_failed
          - permission_denied
          - origin_not_allowed
          - not_found
          - conflict
          - request_failed
      required:
      - error
    Login:
      type: object
      properties:
        user_id: *id008
        login: *id007
        expires_at: *id015
        token:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Opaque bearer token. Keep in memory; never log.
      required:
      - user_id
      - login
      - expires_at
      - token
    PersonPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Person'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          description: Use as after on next request; null indicates last page.
      required:
      - items
      - next_cursor
    ManagementPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagementRow'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          description: Use as after on next request; null indicates last page.
      required:
      - items
      - next_cursor
    AssetPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagementRow'
          maxItems: 100
      required:
      - items
    ExtensionField:
      type: object
      properties:
        key: *id007
        label: *id007
        type:
          $ref: '#/components/schemas/FieldType'
        required: *id012
      required:
      - key
      - label
      - type
    ExtensionType:
      type: object
      properties:
        key: *id007
        label: *id007
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionField'
      required:
      - key
      - label
      - fields
    Extension:
      type: object
      properties:
        id: *id007
        name: *id007
        version: *id007
        types:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionType'
        installed: *id012
      required:
      - id
      - name
      - version
      - types
      - installed
