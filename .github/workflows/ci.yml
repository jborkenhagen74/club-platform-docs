name: Documentation and Examples

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure extension example
        run: cmake -S examples/extensions/hello-extension -B build/hello-extension -DCMAKE_BUILD_TYPE=Release
      - name: Build extension example
        run: cmake --build build/hello-extension --config Release --parallel

      - name: Load and check historical ABI 2
        run: ctest --test-dir build/hello-extension -C Release --output-on-failure

  contract-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify public contract files
        shell: bash
        run: |
          test -s sdk/extension_api.h
          test -s openapi/club-platform.yaml
          grep -q "openapi: 3.1.0" openapi/club-platform.yaml
          grep -q "CLUBPLATFORM_EXTENSION_ABI_VERSION" sdk/extension_api.h
          python3 scripts/check-docs.py
      - name: Validate multilingual and versioned contracts
        run: |
          python3 -m pip install -r requirements-docs.txt
          python3 tools/check_docs.py
          python3 tools/check_contract.py
          node --check examples/frontends/web-basic/app.js
      - name: Install V3 example dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Build current V3 example
        run: |
          cmake -S sdk/examples/v3-extension -B build/v3 -DCLUB_SDK="$GITHUB_WORKSPACE/sdk/include"
          cmake --build build/v3 --parallel 2
