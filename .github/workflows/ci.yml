name: Documentation and Examples

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure extension example
        run: cmake -S examples/extensions/hello-extension -B build/hello-extension -DCMAKE_BUILD_TYPE=Release
      - name: Build extension example
        run: cmake --build build/hello-extension --config Release --parallel
      - name: Load and check ABI 2
        run: ctest --test-dir build/hello-extension -C Release --output-on-failure

  contract-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install contract validator
        run: python -m pip install -r requirements-docs.txt
      - name: Verify documentation and contract
        run: |
          python tools/check_docs.py
          python tools/check_contract.py
          node --check examples/frontends/web-basic/app.js
